<!DOCTYPE html>
<html>
<head>
    <title>JSON Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .list-group-item.active-file {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            font-weight: 600;
            border-color: #0d6efd;
        }
    </style>


</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row" style="height:100vh">

        <!-- LEFT SIDEBAR -->
        <div class="col-3 border-end p-3 bg-white">
            <h5>📂 Fureal 3D ({{ model_library|length }})</h5>

            
            <ul class="list-group">
                {% for item in model_library %}
                <li class="list-group-item list-group-item-action
                    {% if selected and item.path == selected.path %}active-file{% endif %}"
                    data-path="{{ item.path }}"
                    onclick="go('{{ item.shortLabel }}')"
                    style="cursor:pointer; text-transform: capitalize;">
                    {{ item.label }}
                </li>

                {% endfor %}
            </ul>

        </div>

        <!-- RIGHT PANEL -->
        <div class="col-9 p-4">
            

            <table class="table table-bordered mt-3" id="dataTable" style="display:none">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Cost</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <nav class="mt-3">
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>

    </div>
</div>

<script>
let currentData = []
let currentFile = null

let currentPage = 1
const PAGE_SIZE = 20


function go(room) {
    history.pushState({}, "", "/" + room)
    loadByRoom(room)
}


function loadByRoom(room) {
    const map = {{ model_library | tojson }}
    const item = map.find(
        x => x.shortLabel === room || x.activeRoom === room
    )
    if (!item) return

    loadFile(item.path)
}


function renderTable() {
    const tbody = document.querySelector("#dataTable tbody")
    tbody.innerHTML = ""

    const start = (currentPage - 1) * PAGE_SIZE
    const end = start + PAGE_SIZE
    const pageData = currentData.slice(start, end)

    pageData.forEach((item, idx) => {
        const i = start + idx   // index thật
        tbody.innerHTML += `
        <tr>
            <td>${i}</td>
            <td><input class="form-control" value="${item.type || ''}"
                onchange="update(${i}, 'type', this.value)"></td>
            <td><input class="form-control" value="${item.name || ''}"
                onchange="update(${i}, 'name', this.value)"></td>
            <td><input type="number" class="form-control" value="${item.cost || 0}"
                onchange="update(${i}, 'cost', this.value)"></td>
            <td>
                <button class="btn btn-sm" onclick="delRow(${i})">🗑</button>
            </td>
        </tr>
        `
    })

    renderPagination()
}

function renderPagination() {
    const totalPages = Math.ceil(currentData.length / PAGE_SIZE)
    const pag = document.getElementById("pagination")
    pag.innerHTML = ""

    if (totalPages <= 1) return

    // Prev
    pag.innerHTML += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" onclick="goPage(${currentPage - 1})">«</a>
        </li>
    `

    for (let p = 1; p <= totalPages; p++) {
        pag.innerHTML += `
            <li class="page-item ${p === currentPage ? 'active' : ''}">
                <a class="page-link" onclick="goPage(${p})">${p}</a>
            </li>
        `
    }

    // Next
    pag.innerHTML += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" onclick="goPage(${currentPage + 1})">»</a>
        </li>
    `
}

function goPage(page) {
    const totalPages = Math.ceil(currentData.length / PAGE_SIZE)
    if (page < 1 || page > totalPages) return
    currentPage = page
    renderTable()
}

function loadFile(filename) {
    document
        .querySelectorAll(".list-group-item")
        .forEach(e => e.classList.remove("active-file"))

    const el = document.querySelector(`[data-path="${filename}"]`)
    if (el) el.classList.add("active-file")

    fetch(`https://www.n-lux.com/creative/json/${filename}?t=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
            currentFile = filename
            currentData = data
            currentPage = 1
            document.getElementById("dataTable").style.display = ""
            renderTable()
        })
}


let saveTimer = null

function update(i, field, value) {
    currentData[i][field] = value

    clearTimeout(saveTimer)
    saveTimer = setTimeout(() => {
        fetch(`/api/update/${currentFile}/${i}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ [field]: value })
        })
    }, 500)
}


function delRow(i) {
    currentData.splice(i, 1)
    renderTable()
}

window.onload = () => {
    const room = location.pathname.replace("/", "")
    if (!room) return

    const map = {{ model_library | tojson }}
    const item = map.find(
        x => x.shortLabel === room || x.activeRoom === room
    )
    if (item) loadFile(item.path)
}


</script>

</body>
</html>

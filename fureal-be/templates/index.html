<!DOCTYPE html>
<html>
<head>
    <title>JSON Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/reset.css">
    <script src="https://cdn.jsdelivr.net/npm/antd@5/dist/antd.min.js"></script>

    <style>
        .list-group-item.active-file {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            font-weight: 600;
            border-color: #0d6efd;
        }

        input.form-control { font-size: 0.875rem; }
        .editable { cursor: pointer; background: #f8f9fa; }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid">
    <div class="row" style="height:100vh">
        <!-- LEFT SIDEBAR -->
        <div class="col-3 border-end p-3 bg-white">
            <h5>📂 Fureal 3D ({{ model_library|length }})</h5>

            <ul class="list-group" id="categoryTabs">
                {% for item in model_library %}
                <li class="list-group-item list-group-item-action
                    {% if selected and item.path == selected.path %}active-file{% endif %}"
                    data-path="{{ item.path }}"
                    onclick="go('{{ item.shortLabel }}')"
                    style="cursor:pointer; text-transform: uppercase;">
                    {{ item.label }}
                </li>
                {% endfor %}

                <li class="nav-item">
                    <a class="nav-link active" href="#" data-category="fengshui" onclick="switchCategory(event)">
                        <h5>Fengshui</h5>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-category="user" onclick="switchCategory(event)">
                        <h5>User</h5>
                    </a>
                </li>
            </ul>
        </div>

        <!-- RIGHT PANEL -->
        <div class="col-9 p-4">
            <div id="loading" class="text-center my-5" style="display:none">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2 text-muted">Loading data...</div>
            </div>

            <!-- Material Table -->
            <table class="table table-bordered mt-3" id="materialTable" style="display:none">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Preview</th>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Cost</th>
                        <th>Mtl</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <!-- Fengshui Table -->
            <table class="table table-bordered mt-3" id="fengshuiTable" style="display:none">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Element</th>
                        <th>Valid</th>
                        <th>Invalid</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <!-- User Table -->
            <table class="table table-bordered mt-3" id="userTable" style="display:none">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Full Name</th>
                        <th>Facebook</th>
                        <th>Password</th>
                        <th>Phone</th>
                        <th>Username</th>
                        <th>Type</th>
                        <th>Bank</th>
                        <th>ID</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <nav class="mt-3">
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<script>
let currentData = []
let currentFile = null
let currentCategory = "fengshui"
let currentPage = 1
const PAGE_SIZE = 20
let userTotalPages = 1

// Show/hide loading
function showLoading() {
    document.getElementById("loading").style.display = "block";
    document.getElementById("materialTable").style.display = "none";
    document.getElementById("fengshuiTable").style.display = "none";
    document.getElementById("userTable").style.display = "none";
}

function hideLoading() {
    document.getElementById("loading").style.display = "none";
    if (currentCategory === "material") document.getElementById("materialTable").style.display = "";
    else if (currentCategory === "fengshui") document.getElementById("fengshuiTable").style.display = "";
    else if (currentCategory === "user") document.getElementById("userTable").style.display = "";
}

// Switch tab
function switchCategory(e) {
    e.preventDefault();
    document.querySelectorAll("#categoryTabs .nav-link").forEach(t => t.classList.remove("active"));
    e.currentTarget.classList.add("active");
    currentCategory = e.currentTarget.dataset.category;
    currentPage = 1;
    loadData();
}

// Load data theo category
async function loadData() {
    showLoading();

    if (currentCategory === "fengshui") {
        fetch('https://n-lux.com/creative/json/fengshui.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                currentData = Object.keys(data).map(key => ({
                    element: key,
                    valid: data[key].valid,
                    invalid: data[key].invalid
                }));
                renderFengshuiTable();
                hideLoading();
            }).catch(err => { console.error(err); hideLoading(); alert("Không load được dữ liệu Fengshui"); });
    } else if (currentCategory === "user") {
        fetch(`https://admake.vn/api/user/?lead=1&page=${currentPage}`)
            .then(res => res.json())
            .then(res => {
                const usersArray = res.data || []; // fallback nếu undefined
                currentData = usersArray.map(u => ({
                    fullName: u.fullName,
                    facebookAccount: u.facebookAccount,
                    password: u.password,
                    phone: u.phone,
                    username: u.username,
                    type: u.type,
                    bankAccount: u.bankAccount,
                    id: u.id,
                    email: u.email
                }));
                userTotalPages = res.totalPages || 1;
                renderUserTable();
                hideLoading();
            }).catch(err => { hideLoading(); console.error(err); });
    } else if (currentCategory === "material") {
        if(!currentFile) return;
        fetch(`https://www.n-lux.com/creative/json/${currentFile}?t=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                currentData = data;
                renderMaterialTable();
                hideLoading();
            }).catch(err => { hideLoading(); alert("Load failed"); console.error(err); });
    }
}

// Render material table
function renderMaterialTable() {
    const tbody = document.querySelector("#materialTable tbody");
    tbody.innerHTML = "";
    currentData.forEach((item, idx) => {
        tbody.innerHTML += `<tr>
            <td>${idx+1}</td>
            <td>${item.preview ? `<img src="https://www.n-lux.com/creative${item.preview}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;">` : ''}</td>
            <td><input class="form-control" value="${item.type||''}" onchange="update(${idx}, 'type', this.value)"></td>
            <td><input class="form-control" value="${item.name||''}" onchange="update(${idx}, 'name', this.value)"></td>
            <td><input type="number" class="form-control" value="${item.cost||0}" onchange="update(${idx}, 'cost', this.value)"></td>
            <td><button class="btn btn-sm btn-outline-secondary" onclick="openMaterialModal(currentFile)"></button></td>
            <td><button class="btn btn-sm" onclick="delRow(${idx})">🗑</button></td>
        </tr>`;
    });
    document.getElementById("pagination").innerHTML = "";
}

// Render fengshui table
function renderFengshuiTable() {
    const tbody = document.querySelector("#fengshuiTable tbody");
    tbody.innerHTML = "";
    currentData.forEach((item, idx) => {
        tbody.innerHTML += `
            <tr>
                <td>${idx+1}</td>
                <td contenteditable="true" class="editable" ondblclick="makeEditable(this)" 
                    onchange="updateFengshui('${item.element}', 'element', this.innerText)">${item.element}</td>
                <td><textarea class="form-control" rows="2" onchange="updateFengshui('${item.element}', 'valid', this.value)">${Array.isArray(item.valid) ? item.valid.join(', ') : item.valid}</textarea></td>
                <td><textarea class="form-control" rows="2" onchange="updateFengshui('${item.element}', 'invalid', this.value)">${Array.isArray(item.invalid) ? item.invalid.join(', ') : item.invalid}</textarea></td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteFengshui('${item.element}')">🗑</button></td>
        </tr>`;
    });
    document.getElementById("pagination").innerHTML = "";
}

// Fengshui Update
async function updateFengshui(element, field, value) {
    const index = currentData.findIndex(item => item.element === element);
    if (index !== -1) currentData[index][field] = value.split(',').map(s => s.trim()).filter(Boolean);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        fetch(`/api/fengshui/${element}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({[field]: value.split(',').map(s => s.trim())})
        }).then(res => res.json()).catch(console.error);
    }, 500);
}


// Fengshui Delete
async function deleteFengshui(element) {
    if (confirm(`Delete ${element}?`)) {
        await fetch(`/api/fengshui/${element}`, {method: 'DELETE'});
        currentData = currentData.filter(item => item.element !== element);
        renderFengshuiTable();
    }
}


// User Render - Full Editable
function renderUserTable() {
    const tbody = document.querySelector("#userTable tbody");
    tbody.innerHTML = "";
    currentData.forEach((item, idx) => {
        tbody.innerHTML += `
            <tr>
                <td>${(currentPage-1)*PAGE_SIZE + idx + 1}</td>
                <td><input class="form-control" value="${item.fullName||''}" onchange="updateUser(${item.id}, 'fullName', this.value)"></td>
                <td><input class="form-control" value="${item.facebookAccount||''}" onchange="updateUser(${item.id}, 'facebookAccount', this.value)"></td>
                <td><input type="password" class="form-control" value="${item.password||''}" onchange="updateUser(${item.id}, 'password', this.value)"></td>
                <td><input class="form-control" value="${item.phone||''}" onchange="updateUser(${item.id}, 'phone', this.value)"></td>
                <td><input class="form-control" value="${item.username||''}" onchange="updateUser(${item.id}, 'username', this.value)"></td>
                <td><input class="form-control" value="${item.type||''}" onchange="updateUser(${item.id}, 'type', this.value)"></td>
                <td><input class="form-control" value="${item.bankAccount||''}" onchange="updateUser(${item.id}, 'bankAccount', this.value)"></td>
                <td>${item.id}</td>
                <td><input class="form-control" value="${item.email||''}" onchange="updateUser(${item.id}, 'email', this.value)"></td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteUser(${item.id})">🗑</button></td>
            </tr>`;
    });
    renderUserPagination();
}

// User Update (local cache + proxy)
async function updateUser(userId, field, value) {
    const index = currentData.findIndex(u => u.id == userId);
    if (index !== -1) currentData[index][field] = value;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        fetch(`/api/user/${userId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({[field]: value})
        }).then(res => res.json()).catch(console.error);
    }, 500);
}

async function deleteUser(userId) {
    if (confirm('Delete user?')) {
        await fetch(`/api/user/${userId}`, {method: 'DELETE'});
        currentData = currentData.filter(u => u.id != userId);
        renderUserTable();
    }
}

// Pagination user
function renderUserPagination() {
    const pag = document.getElementById("pagination");
    pag.innerHTML = "";
    if(userTotalPages <=1) return;

    pag.innerHTML += `<li class="page-item ${currentPage===1?'disabled':''}"><a class="page-link" onclick="goPage(${currentPage-1})">«</a></li>`;
    for(let p=1;p<=userTotalPages;p++){
        pag.innerHTML += `<li class="page-item ${p===currentPage?'active':''}"><a class="page-link" onclick="goPage(${p})">${p}</a></li>`;
    }
    pag.innerHTML += `<li class="page-item ${currentPage===userTotalPages?'disabled':''}"><a class="page-link" onclick="goPage(${currentPage+1})">»</a></li>`;
}

// Pagination chung
function goPage(page){
    if(currentCategory === "user"){
        if(page<1||page>userTotalPages) return;
        currentPage = page;
        loadData();
    }
}

// Material update/delete
let saveTimer=null;
function update(i, field, value){
    currentData[i][field]=value;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
        fetch(`/api/update/${currentFile}/${i}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({[field]:value})
        })
    },500);
}
function delRow(i){
    currentData.splice(i,1);
    if(currentCategory==="material") renderMaterialTable();
    else if(currentCategory==="user") renderUserTable();
    else renderFengshuiTable();
}

// Load material by room
function go(room){
    history.pushState({}, "", "/"+room);
    loadByRoom(room);
}
function loadByRoom(room){
    const map={{ model_library|tojson }};
    const item = map.find(x=>x.shortLabel===room||x.activeRoom===room);
    if(!item) return;
    currentCategory="material";
    currentFile=item.path;
    loadData();
}

// Init
window.onload=()=>{
    const room = location.pathname.replace(/^\/creative\//,"");
    if(!room) return;
    loadByRoom(room);
};
</script>
</body>
</html>

<script>
const BASE_JSON_URL = "https://n-lux.com/creative/json";
const LIBRARY_URL = "/static/modelLibrary.json"; // hoặc URL thật

let currentFile = null;
let currentLabel = null;
let jsonData = [];

const PAGE_SIZE = 20;
let currentPage = 1;

/* =====================
   LOAD MODEL LIBRARY
===================== */
fetch("/creative/json/modelLibrary.json")
  .then(r => r.json())
  .then(list => {
    const nav = document.getElementById("navLeft");
    list.forEach(m => {
      nav.innerHTML += `
        <button class="list-group-item list-group-item-action"
          onclick="loadFile('${m.path}')">
          <img src="${m.icon}" width="20"> ${m.label}
        </button>`;
    });
  });


function renderNav(list) {
    const nav = document.getElementById("navList");
    nav.innerHTML = "";

    list.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "nav-item-btn";
        btn.style.background = item.gradient;
        btn.innerHTML = `
            <img src="${item.icon}" width="18" class="me-2">
            ${item.label}
        `;
        btn.onclick = () => {
            document.querySelectorAll(".nav-item-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            loadFile(item.path, item.label);
        };
        nav.appendChild(btn);
    });
}

/* =====================
   LOAD JSON FILE
===================== */
function loadFile(path, label) {
    currentFile = path;
    currentLabel = label;
    currentPage = 1;

    document.getElementById("currentLabel").innerText = label;
    document.getElementById("addForm").classList.remove("d-none");

    fetch(`${BASE_JSON_URL}/${encodeURIComponent(path)}`)
        .then(r => r.json())
        .then(data => {
            jsonData = Array.isArray(data) ? data : [];
            renderPage();
        });
}

function update(i, field, value) {
    jsonData[i][field] = value;

    fetch(`/api/json/save/${currentFile}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(jsonData)
    });
}

function del(i) {
    if (!confirm("Delete?")) return;
    jsonData.splice(i, 1);
    save();
}

function save() {
    fetch(`/api/json/save/${currentFile}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(jsonData)
    });
}



/* =====================
   RENDER PAGE
===================== */
function renderPage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageData = jsonData.slice(start, start + PAGE_SIZE);

    let html = `
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>#</th><th>Type</th><th>Name</th><th>Cost</th><th></th>
        </tr>
        </thead><tbody>`;

    pageData.forEach((item, idx) => {
        const i = start + idx;
        html += `
        <tr>
            <td>${i}</td>
            <td><input value="${item.type || ''}" class="form-control"
                onchange="update(${i}, 'type', this.value)"></td>
            <td><input value="${item.name || ''}" class="form-control"
                onchange="update(${i}, 'name', this.value)"></td>
            <td><input type="number" value="${item.cost || 0}" class="form-control"
                onchange="update(${i}, 'cost', this.value)"></td>
            <td>
                <button class="btn btn-sm btn-danger" onclick="del(${i})">🗑</button>
            </td>
        </tr>`;
    });

    html += "</tbody></table>";
    document.getElementById("tableWrap").innerHTML = html;
    renderPagination();
}

/* =====================
   PAGINATION
===================== */
function renderPagination() {
    const totalPages = Math.ceil(jsonData.length / PAGE_SIZE);
    let html = "";

    for (let i = 1; i <= totalPages; i++) {
        html += `
        <button class="btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'} me-1"
            onclick="gotoPage(${i})">${i}</button>`;
    }

    document.getElementById("pagination").innerHTML = html;
}

function gotoPage(p) {
    currentPage = p;
    renderPage();
}

/* =====================
   CRUD
===================== */
function addItem() {
    const payload = {
        type: new_type.value,
        file: new_file.value,
        preview: new_preview.value,
        name: new_name.value,
        cost: new_cost.value,
        color: new_color.value
    };

    fetch(`/file/${currentFile}/add`, {
        method: "POST",
        body: new URLSearchParams(payload)
    }).then(() => loadFile(currentFile, currentLabel));
}

function update(i, field, value) {
    fetch(`/file/${currentFile}/update/${i}`, {
        method: "POST",
        body: new URLSearchParams({ [field]: value })
    });
}

function del(i) {
    if (!confirm("Delete item?")) return;
    fetch(`/file/${currentFile}/delete/${i}`, { method: "POST" })
        .then(() => loadFile(currentFile, currentLabel));
}
</script>

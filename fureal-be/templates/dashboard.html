<!DOCTYPE html>
<html>
<head>
    <title>Model Library Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { overflow: hidden; }
        .sidebar {
            width: 280px;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        .content {
            height: 100vh;
            overflow-y: auto;
        }
        .nav-item-btn {
            border: none;
            width: 100%;
            text-align: left;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            color: #000;
        }
        .nav-item-btn.active {
            color: #fff;
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- LEFT NAV -->
    <div class="sidebar p-3 bg-light">
        <h6 class="mb-3">📚 Model Library</h6>
        <div id="navList"></div>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="flex-grow-1 content p-4">
        <h4 id="currentLabel">Select a category</h4>

        <!-- ADD FORM -->
        <div id="addForm" class="card p-3 mb-3 d-none">
            <div class="row g-2">
                <input class="form-control col" placeholder="type" id="new_type">
                <input class="form-control col" placeholder="file" id="new_file">
                <input class="form-control col" placeholder="preview" id="new_preview">
                <input class="form-control col" placeholder="name" id="new_name">
                <input class="form-control col" placeholder="cost" type="number" id="new_cost">
                <input class="form-control col" placeholder="color" value="bw" id="new_color">
            </div>
            <button class="btn btn-success mt-2" onclick="addItem()">➕ Add</button>
        </div>

        <div id="tableWrap"></div>
        <div id="pagination" class="mt-3"></div>
    </div>
</div>

{% include "dashboard_js.html" %}
</body>
</html>
